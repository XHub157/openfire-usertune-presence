name: Build and Release

# Запускается вручную через GitHub Actions → Run workflow.
# Версию указываешь сам в поле ввода — она пишется в plugin.xml,
# становится тегом git и названием GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.1)"
        required: true
        default: "1.0.0"
      release_notes:
        description: "Release notes (shown in GitHub Release)"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно для создания тега и релиза

    steps:
      # 1. Получаем исходники
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 11 — минимум для ветки Openfire 4.9.x
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # 3. Вписываем версию из input в plugin.xml
      - name: Patch plugin.xml version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i "s|<version>.*</version>|<version>${VERSION}</version>|" \
            src/main/resources/plugin.xml
          echo "plugin.xml patched to version ${VERSION}"

      # 4. Вписываем версию в pom.xml (опционально, для консистентности)
      - name: Patch pom.xml version
        run: |
          mvn -B versions:set \
            -DnewVersion="${{ github.event.inputs.version }}" \
            -DgenerateBackupPoms=false

      # 5. Сборка
      - name: Build with Maven
        run: mvn -B clean package

      # 6. Переименовываем артефакт — имя без версии в суффиксе,
      #    как ожидает Openfire при ручной установке
      - name: Rename artifact
        run: |
          VERSION="${{ github.event.inputs.version }}"
          cp target/usertunepresence.jar \
             target/usertunepresence-${VERSION}.jar

      # 7. Создаём git-тег
      - name: Create git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      # 8. Создаём GitHub Release и прикладываем JAR
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "v${{ github.event.inputs.version }}"
          body: |
            ${{ github.event.inputs.release_notes }}

            ## Installation
            Download `usertunepresence-${{ github.event.inputs.version }}.jar`
            and upload it via **Admin Console → Plugins → Upload Plugin**.

            ## Compatibility
            | Openfire | Java |
            |----------|------|
            | 4.6.x – 4.9.x | 11+ |
            | 5.0.x+ | 17+ |
          files: target/usertunepresence-${{ github.event.inputs.version }}.jar
          draft: false
          prerelease: false
